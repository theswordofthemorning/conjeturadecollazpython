<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de dependencias</title>
<style>
:root {
  --fondo: #f6f4ef; --panel: #ffffff; --texto: #1f2328; --suave: #5d636b; --borde: #d8d4ca;
  --demostrado: #3f9b5b; --medido: #e0b531; --conjeturado: #8e7cc3; --pendiente: #a3a8ad; --refutado: #d0533f;
  --fruto: #c8961b; --actual: #1f6feb; --flojo: #f0883e; --apoyo: #1f6feb; --sostiene: #2da44e;
  --arista: #b9b4a8; --tenue: 0.12;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #14171b; --panel: #1d2127; --texto: #e6e8eb; --suave: #9aa1a9; --borde: #343a42;
    --demostrado: #4fb26d; --medido: #d9ae2c; --conjeturado: #a593d8; --pendiente: #6e757c; --refutado: #e06650;
    --fruto: #e3b33a; --actual: #58a6ff; --flojo: #f0883e; --apoyo: #58a6ff; --sostiene: #3fb950;
    --arista: #4a515a;
  }
}
:root[data-theme="dark"] {
  --fondo: #14171b; --panel: #1d2127; --texto: #e6e8eb; --suave: #9aa1a9; --borde: #343a42;
  --demostrado: #4fb26d; --medido: #d9ae2c; --conjeturado: #a593d8; --pendiente: #6e757c; --refutado: #e06650;
  --fruto: #e3b33a; --actual: #58a6ff; --flojo: #f0883e; --apoyo: #58a6ff; --sostiene: #3fb950;
  --arista: #4a515a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--fondo); color: var(--texto); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
header { padding: 12px 16px 8px; border-bottom: 1px solid var(--borde); background: var(--panel); }
h1 { font-size: 19px; margin: 0 0 2px; }
.sub { color: var(--suave); font-size: 13px; }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; }
.leyenda span { display: inline-flex; align-items: center; gap: 5px; }
.punto { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.barra { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
button, select, input { font: inherit; color: var(--texto); background: var(--fondo); border: 1px solid var(--borde); border-radius: 6px; padding: 4px 10px; }
button { cursor: pointer; }
button:hover { border-color: var(--suave); }
button.activo { background: var(--texto); color: var(--fondo); border-color: var(--texto); }
.pestanas { display: flex; gap: 4px; flex-wrap: wrap; }
main { flex: 1; display: flex; min-height: 0; }
#lienzo { flex: 1; min-width: 0; position: relative; }
#cy { position: absolute; inset: 0; }
aside { width: 380px; max-width: 42vw; border-left: 1px solid var(--borde); background: var(--panel); overflow: auto; padding: 14px 16px; }
aside h2 { font-size: 18px; margin: 0 0 4px; }
aside h3 { font-size: 14px; margin: 14px 0 4px; color: var(--suave); text-transform: uppercase; letter-spacing: .03em; }
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; color: #fff; margin: 0 4px 4px 0; }
.etiqueta { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--borde); margin: 0 4px 4px 0; }
.enlace { color: var(--actual); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.aviso { border-left: 4px solid var(--flojo); padding: 6px 10px; background: color-mix(in srgb, var(--flojo) 10%, transparent); border-radius: 4px; margin: 8px 0; font-size: 14px; }
.bien { border-left-color: var(--demostrado); background: color-mix(in srgb, var(--demostrado) 10%, transparent); }
.af { border: 1px solid var(--borde); border-radius: 6px; padding: 6px 8px; margin: 6px 0; font-size: 13px; }
.af summary { cursor: pointer; }
.af .meta { color: var(--suave); font-size: 12px; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
.vista { flex: 1; overflow: auto; padding: 14px 16px; display: none; }
.vista.visible { display: block; }
.vista table { border-collapse: collapse; width: 100%; font-size: 13px; }
.vista td, .vista th { border-bottom: 1px solid var(--borde); padding: 5px 6px; text-align: left; vertical-align: top; }
.tarjeta { background: var(--panel); border: 1px solid var(--borde); border-radius: 8px; padding: 10px 12px; margin: 0 0 10px; }
.tarjeta h3 { margin: 0 0 6px; font-size: 16px; }
.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
.vacio { color: var(--suave); }
#error { display: none; padding: 20px; }
@media (max-width: 760px) {
  main { flex-direction: column; }
  #lienzo { min-height: 60vh; }
  aside { width: auto; max-width: none; border-left: none; border-top: 1px solid var(--borde); max-height: 45vh; }
}
</style>
</head>
<body>
<header>
  <h1 id="titulo">Mapa de dependencias</h1>
  <div class="sub" id="subtitulo"></div>
  <div class="leyenda" id="leyenda"></div>
  <div class="barra">
    <div class="pestanas" id="pestanas"></div>
    <input id="buscar" placeholder="Buscar animal…" size="16" aria-label="Buscar">
    <button id="ver-todo">Ver todo</button>
    <button id="ir-actual">Rama actual</button>
    <button id="tema" title="Cambiar claro/oscuro">◐</button>
  </div>
</header>
<div id="error">No se pudo cargar la librería de dibujo. Hace falta conexión a internet la primera vez.</div>
<main id="principal">
  <div id="lienzo"><div id="cy"></div></div>
  <aside id="panel"></aside>
</main>
<div class="vista" id="vista-alarmas"></div>
<div class="vista" id="vista-afirmaciones"></div>
<div class="vista" id="vista-correcciones"></div>

<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<script>
const MODO = '__MODO__';
const D = __DATOS__;
const COMPLEJO = MODO === 'complex';

const ESTADOS = {
  demostrado: 'Demostrado: probado con un razonamiento',
  medido: 'Medido: el ordenador lo vio en muchos casos, no es prueba',
  conjeturado: 'Conjeturado: se cree, sin prueba',
  pendiente: 'Pendiente: falta hacerlo',
  refutado: 'Refutado: resultó falso',
};
const CORTO = { demostrado: 'demostrado', medido: 'medido', conjeturado: 'conjeturado', pendiente: 'pendiente', refutado: 'refutado' };
const ORDEN = ['demostrado', 'medido', 'conjeturado', 'pendiente', 'refutado'];
const css = n => getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- datos ----------
const nodos = new Map();
D.nodos.forEach(n => nodos.set(n.nombre, Object.assign({ tipo: 'nodo' }, n)));
D.ramas.forEach(r => nodos.set(r.nombre, Object.assign({ tipo: 'rama', estado: 'mezcla', descripcion: '' }, r)));
const padres = new Map(), hijos = new Map();
for (const k of nodos.keys()) { padres.set(k, new Set()); hijos.set(k, new Set()); }
D.aristas.forEach(([h, p]) => { padres.get(h).add(p); hijos.get(p).add(h); });
const afid = new Map(D.afirmaciones.map(a => [a.id, a]));
function cierre(n, mapa) {
  const vistos = new Set(), pila = [n];
  while (pila.length) for (const x of mapa.get(pila.pop())) if (!vistos.has(x)) { vistos.add(x); pila.push(x); }
  return vistos;
}
const sueltos = [...nodos.values()].filter(n => n.tipo === 'rama' || (padres.get(n.nombre).size === 0 && hijos.get(n.nombre).size === 0));
const sueltoSet = new Set(sueltos.map(n => n.nombre));

// ---------- cabecera ----------
document.getElementById('titulo').textContent = COMPLEJO ? 'Mapa de dependencias: completo' : 'Mapa de dependencias: básico';
document.title = COMPLEJO ? 'Mapa completo' : 'Mapa básico';
const nDem = D.nodos.filter(n => n.estado === 'demostrado').length;
document.getElementById('subtitulo').textContent =
  `Registro del ${D.version} · ${D.nodos.length} piezas en el árbol, ${D.aristas.length} flechas · ` +
  (COMPLEJO ? `${D.afirmaciones.length} afirmaciones, ${D.correcciones.length} correcciones · ` : '') +
  'Abajo lo básico, arriba lo más desarrollado. Pincha una pieza para ver su rama.';
const leyenda = document.getElementById('leyenda');
ORDEN.forEach(e => leyenda.insertAdjacentHTML('beforeend', `<span><i class="punto" style="background:var(--${e})"></i>${ESTADOS[e].split(':')[0]}</span>`));
leyenda.insertAdjacentHTML('beforeend',
  `<span>🏆 conjetura publicada resuelta</span><span>👁 falta revisión humana</span><span>⚠ usa una hipótesis externa</span>` +
  `<span><i class="punto" style="border:2px dashed var(--suave)"></i>sin conectar al árbol</span>` +
  `<span><i class="punto" style="border:3px solid var(--actual)"></i>rama actual</span>`);

// ---------- pestañas ----------
const VISTAS = COMPLEJO
  ? [['arbol', 'Árbol'], ['alarmas', 'Alarmas'], ['afirmaciones', 'Las ' + D.afirmaciones.length + ' afirmaciones'], ['correcciones', 'Lo que se cayó']]
  : [['arbol', 'Árbol'], ['alarmas', 'Alarmas']];
const pest = document.getElementById('pestanas');
VISTAS.forEach(([id, txt]) => pest.insertAdjacentHTML('beforeend', `<button data-v="${id}">${txt}</button>`));
function mostrar(v) {
  pest.querySelectorAll('button').forEach(b => b.classList.toggle('activo', b.dataset.v === v));
  document.getElementById('principal').style.display = v === 'arbol' ? 'flex' : 'none';
  document.querySelectorAll('.vista').forEach(x => x.classList.toggle('visible', x.id === 'vista-' + v));
  ['buscar', 'ver-todo', 'ir-actual'].forEach(id => document.getElementById(id).style.visibility = v === 'arbol' ? 'visible' : 'hidden');
  if (v === 'arbol' && cy) cy.resize();
  try { localStorage.setItem('mapa-vista-' + MODO, v); } catch (e) {}
}
pest.addEventListener('click', e => { if (e.target.dataset.v) mostrar(e.target.dataset.v); });

// ---------- tema ----------
document.getElementById('tema').addEventListener('click', () => {
  const r = document.documentElement;
  const oscuro = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = oscuro ? 'light' : 'dark';
  try { localStorage.setItem('mapa-tema', r.dataset.theme); } catch (e) {}
  if (cy) cy.style(estilo());
});
try { const t = localStorage.getItem('mapa-tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

// ---------- grafo ----------
let cy = null;
function etiqueta(n) {
  let marcas = '';
  if (n.fruto) marcas += '🏆 ';
  let linea = n.titulo + (n.revision_humana ? ' 👁' : '') + (n.condicional ? ' ⚠' : '');
  let sub = n.subtitulo || '';
  if (n.tipo === 'rama') { const c = n.conteo || {}; sub = (sub ? sub + '\n' : '') + ORDEN.filter(e => c[e]).map(e => c[e] + ' ' + CORTO[e].slice(0, 4) + '.').join(' · '); }
  else if (COMPLEJO && n.afirmaciones.length) sub = (sub ? sub + ' · ' : '') + n.afirmaciones.length + ' afirm.';
  if (n.nombre === D.actual) marcas = '📍 AQUÍ ESTAMOS\n' + marcas;
  return marcas + linea + (sub ? '\n' + sub : '');
}
function elementos() {
  const els = [];
  for (const n of nodos.values()) {
    const lab = etiqueta(n);
    const ancho = Math.max(90, Math.min(260,Math.max(...lab.split('\n').map(l => l.length)) * 7 + 22));
    const c = n.conteo || {}, tot = Object.values(c).reduce((a, b) => a + b, 0) || 1;
    const data = { id: n.nombre, label: lab, w: ancho, h: 26 + 15 * lab.split('\n').length, estado: n.estado };
    ORDEN.forEach((e, i) => data['p' + i] = 100 * (c[e] || 0) / tot);
    const cls = [n.tipo, n.fruto ? 'fruto' : '', n.apoyo_flojo && n.apoyo_flojo.length ? 'flojo' : '',
      sueltoSet.has(n.nombre) ? 'suelto' : '', n.nombre === D.actual ? 'actual' : ''].join(' ');
    els.push({ data, classes: cls });
  }
  D.aristas.forEach(([h, p], i) => els.push({ data: { id: 'e' + i, source: p, target: h } }));
  return els;
}
function estilo() {
  const s = [
    { selector: 'node', style: {
      'shape': 'round-rectangle', 'width': 'data(w)', 'height': 'data(h)', 'label': 'data(label)',
      'text-wrap': 'wrap', 'text-valign': 'center', 'text-halign': 'center', 'font-size': 12,
      'color': '#fff', 'text-outline-width': 0, 'background-color': css('pendiente'),
      'text-max-width': 'data(w)', 'border-width': 1, 'border-color': css('borde'), 'font-family': 'system-ui, Segoe UI, sans-serif' } },
    { selector: 'node.rama', style: {
      'background-color': css('panel'), 'color': css('texto'), 'border-style': 'dashed', 'border-width': 2,
      'border-color': css('suave'), 'background-opacity': 1 } },
    { selector: 'node.suelto.nodo', style: { 'border-style': 'dashed', 'border-width': 2, 'border-color': css('suave') } },
    { selector: 'node.fruto', style: { 'border-width': 4, 'border-color': css('fruto'), 'font-weight': 'bold' } },
    { selector: 'node.flojo', style: { 'border-width': 5, 'border-color': css('flojo') } },
    { selector: 'node.actual', style: { 'border-width': 5, 'border-color': css('actual'), 'border-style': 'solid' } },
    { selector: 'edge', style: {
      'width': 1.4, 'line-color': css('arista'), 'target-arrow-color': css('arista'),
      'target-arrow-shape': 'triangle', 'arrow-scale': 0.8, 'curve-style': 'bezier' } },
    { selector: '.tenue', style: { 'opacity': 0.13 } },
    { selector: 'edge.apoyo', style: { 'line-color': css('apoyo'), 'target-arrow-color': css('apoyo'), 'width': 3, 'opacity': 1 } },
    { selector: 'edge.sostiene', style: { 'line-color': css('sostiene'), 'target-arrow-color': css('sostiene'), 'width': 3, 'opacity': 1 } },
    { selector: 'node.elegido', style: { 'border-width': 5, 'border-color': css('texto'), 'opacity': 1 } },
    { selector: 'node.titulo-zona', style: {
      'background-opacity': 0, 'border-width': 0, 'color': css('suave'), 'font-size': 15, 'font-weight': 'bold',
      'events': 'no', 'width': 10, 'height': 10 } },
  ];
  ORDEN.forEach((e, i) => {
    s.push({ selector: `node[estado = "${e}"]`, style: { 'background-color': css(e) } });
  });
  s.push({ selector: 'node[estado = "medido"]', style: { 'color': '#1f2328' } });
  return s;
}
function colocarSueltos() {
  const conectados = cy.nodes().filter(n => !sueltoSet.has(n.id()) && !n.hasClass('titulo-zona'));
  const bb = conectados.boundingBox();
  const x0 = bb.x2 + 160;
  const orden = [...sueltos].sort((a, b) => (b.nombre === D.actual) - (a.nombre === D.actual) || (b.n || 0) - (a.n || 0));
  const col = 2, paso = 230;
  let y = bb.y1 + 40;
  cy.add({ data: { id: '__zona', label: 'Sin conectar al árbol todavía\n(no sabemos en qué se apoyan)' }, classes: 'titulo-zona', position: { x: x0 + paso / 2, y: bb.y1 - 50 } });
  orden.forEach((n, i) => {
    const nd = cy.getElementById(n.nombre);
    nd.position({ x: x0 + (i % col) * paso, y: y + Math.floor(i / col) * 110 });
  });
}
function iniciar() {
  if (typeof cytoscape === 'undefined') { document.getElementById('error').style.display = 'block'; return; }
  if (typeof cytoscapeDagre !== 'undefined') { try { cytoscape.use(cytoscapeDagre); } catch (e) {} }
  cy = cytoscape({ container: document.getElementById('cy'), elements: elementos(), style: estilo(),
    wheelSensitivity: 0.25, minZoom: 0.08, maxZoom: 3 });
  const conectados = cy.elements().filter(e => e.isEdge() || !sueltoSet.has(e.id()));
  conectados.layout({ name: 'dagre', rankDir: 'BT', nodeSep: 18, rankSep: 70, edgeSep: 6, animate: false, fit: false }).run();
  colocarSueltos();
  cy.fit(undefined, 30);
  cy.on('tap', 'node', e => elegir(e.target.id()));
  cy.on('tap', e => { if (e.target === cy) limpiar(); });
}
function limpiar() {
  cy.elements().removeClass('tenue apoyo sostiene elegido');
  panelInicio();
}
function elegir(id, centrar) {
  if (!nodos.has(id)) return;
  const arriba = cierre(id, padres), abajo = cierre(id, hijos);
  cy.elements().removeClass('tenue apoyo sostiene elegido').addClass('tenue');
  const nd = cy.getElementById(id);
  nd.removeClass('tenue').addClass('elegido');
  arriba.forEach(x => cy.getElementById(x).removeClass('tenue'));
  abajo.forEach(x => cy.getElementById(x).removeClass('tenue'));
  cy.edges().forEach(e => {
    const s = e.source().id(), t = e.target().id();
    if ((arriba.has(s) || s === id) && (arriba.has(t) || t === id)) e.removeClass('tenue').addClass('apoyo');
    else if ((abajo.has(s) || s === id) && (abajo.has(t) || t === id)) e.removeClass('tenue').addClass('sostiene');
  });
  if (centrar) cy.animate({ center: { eles: nd }, zoom: Math.max(cy.zoom(), 0.9) }, { duration: 300 });
  panelNodo(id, arriba, abajo);
}

// ---------- panel ----------
const panel = document.getElementById('panel');
const link = n => `<span class="enlace" data-ir="${esc(n)}">${esc(nodos.get(n).titulo)}${nodos.get(n).subtitulo ? ' <small>(' + esc(nodos.get(n).subtitulo) + ')</small>' : ''}</span>`;
panel.addEventListener('click', e => { const t = e.target.closest('[data-ir]'); if (t) elegir(t.dataset.ir, true); });
function chip(e) { return `<span class="chip" style="background:var(--${e});${e === 'medido' ? 'color:#1f2328' : ''}">${CORTO[e] || e}</span>`; }
function htmlAfirmacion(a, conRama) {
  const badges = (a.lean ? '<span class="etiqueta">Lean</span>' : '') + (a.revision_humana ? '<span class="etiqueta">👁 revisión humana</span>' : '') + (a.condicional ? '<span class="etiqueta">⚠ hipótesis</span>' : '');
  const rama = conRama && nodos.has(a.grupo) ? ' · ' + link(a.grupo) : '';
  return `<details class="af"><summary>${chip(a.estado)} <b>#${a.id}</b> ${esc(a.enunciado.slice(0, 150))}${a.enunciado.length > 150 ? '…' : ''}</summary>
    <div>${badges}${rama}</div>
    <div class="meta"><b>Enunciado:</b> ${esc(a.enunciado)}\n<b>Fichero:</b> ${esc(a.fichero || '—')}\n<b>Fuente:</b> ${esc(a.fuente)}${a.notas ? '\n<b>Notas:</b> ' + esc(a.notas) : ''}${a.clave ? '\n<b>Clave:</b> ' + esc(a.clave) : ''}</div></details>`;
}
function panelInicio() {
  const fr = D.nodos.filter(n => n.fruto);
  const act = nodos.get(D.actual);
  panel.innerHTML = `<h2>Cómo leer el árbol</h2>
    <p>Cada caja es una pieza del trabajo. Una flecha de A hacia B quiere decir que <b>B se apoya en A</b>. Lo básico queda abajo y lo más desarrollado arriba.</p>
    <p>Pincha una caja. En <b style="color:var(--apoyo)">azul</b> verás en qué se apoya, hasta el suelo, y en <b style="color:var(--sostiene)">verde</b> lo que se construyó encima.</p>
    <h3>Frutos</h3>${fr.map(n => '🏆 ' + link(n.nombre) + ' — ' + esc(n.fruto)).join('<br>')}
    <h3>Rama actual</h3>${act ? '📍 ' + link(act.nombre) + (act.tipo === 'rama' ? ' — aún no está conectada al árbol en el registro.' : '') : '—'}
    <h3>Alarmas</h3>${resumenAlarmas()}`;
}
function panelNodo(id, arriba, abajo) {
  const n = nodos.get(id);
  const flojos = [...arriba].filter(x => nodos.get(x).estado !== 'demostrado');
  let h = `<h2>${n.fruto ? '🏆 ' : ''}${esc(n.titulo)}</h2>${n.subtitulo ? '<div class="sub">' + esc(n.subtitulo) + '</div>' : ''}`;
  if (n.tipo === 'nodo') h += `<p>${chip(n.estado)} ${esc(ESTADOS[n.estado].split(': ')[1])}</p>`;
  else h += `<p><span class="etiqueta">sin conectar</span> Grupo de ${n.n} afirmaciones que todavía no es una pieza del árbol: el registro no dice en qué se apoya.</p>`;
  if (n.fruto) h += `<p>Resuelve la conjetura de ${esc(n.fruto)}.</p>`;
  if (n.descripcion) h += `<h3>Qué dice</h3><p>${esc(n.descripcion)}</p>`;
  if (n.tipo === 'nodo') {
    if (n.estado === 'demostrado' && flojos.length) h += `<div class="aviso"><b>Ojo:</b> está demostrado, pero se apoya en piezas que no lo están: ${flojos.map(link).join(', ')}.</div>`;
    else if (n.estado === 'demostrado' && arriba.size) h += `<div class="aviso bien">Cimientos sanos: todas las piezas en las que se apoya (${arriba.size}) están demostradas.</div>`;
    else if (flojos.length) h += `<div class="aviso">Se apoya en piezas no demostradas: ${flojos.map(link).join(', ')}.</div>`;
    if (sueltoSet.has(id)) h += `<div class="aviso">Está suelta: el registro no anota en qué se apoya ni qué la usa.</div>`;
  }
  if (n.revision_humana) h += `<div class="aviso">👁 Falta que un matemático humano la revise.</div>`;
  if (n.condicional) h += `<div class="aviso">⚠ Usa una hipótesis que viene de fuera o es condicional.</div>`;
  const pa = [...padres.get(id)], hi = [...hijos.get(id)];
  const vacioPa = id === 'definiciones' ? 'nada (es el suelo)' : 'no está anotado en el registro';
  h += `<h3>Se apoya directamente en</h3>${pa.length ? pa.map(link).join('<br>') : '<span class="vacio">' + vacioPa + '</span>'}`;
  h += `<h3>Lo usan directamente</h3>${hi.length ? hi.map(link).join('<br>') : '<span class="vacio">nadie todavía</span>'}`;
  if (COMPLEJO) {
    const ids = n.afirmaciones || [];
    h += `<h3>Sus afirmaciones (${ids.length})</h3>` + (ids.length ? ids.map(i => htmlAfirmacion(afid.get(i))).join('') : '<span class="vacio">ninguna asignada</span>');
  } else if (n.tipo === 'rama') {
    h += `<p class="sub">El mapa completo muestra sus ${n.n} afirmaciones.</p>`;
  }
  panel.innerHTML = h;
  panel.scrollTop = 0;
}

// ---------- alarmas ----------
function calcularAlarmas() {
  const todos = [...nodos.values()].filter(n => n.tipo === 'nodo');
  const flojos = todos.filter(n => n.apoyo_flojo && n.apoyo_flojo.length);
  const debiles = todos.filter(n => n.estado !== 'demostrado' && hijos.get(n.nombre).size);
  return {
    flojos, debiles,
    revision: [...nodos.values()].filter(n => n.revision_humana),
    condicional: todos.filter(n => n.condicional),
    sueltos,
    refutadas: D.afirmaciones.filter(a => a.estado === 'refutado'),
    revAf: D.afirmaciones.filter(a => a.revision_humana),
    condAf: D.afirmaciones.filter(a => a.condicional),
  };
}
function resumenAlarmas() {
  const A = calcularAlarmas();
  return (A.flojos.length
      ? `<div class="aviso"><b>${A.flojos.length}</b> piezas demostradas se apoyan en algo no demostrado.</div>`
      : `<div class="aviso bien">Ninguna pieza demostrada se apoya en algo sin demostrar (dentro de lo registrado).</div>`) +
    `<div class="aviso">👁 ${A.revision.length} piezas esperan revisión humana, entre ellas los cuatro frutos.</div>` +
    `<div class="aviso">${A.sueltos.length} grupos están sin conectar al árbol.</div>`;
}
function vistaAlarmas() {
  const A = calcularAlarmas();
  const lista = arr => arr.length ? arr.map(n => `<div>${n.fruto ? '🏆 ' : ''}<span class="enlace" data-ir2="${esc(n.nombre)}">${esc(n.titulo)}</span>${n.subtitulo ? ' <small>(' + esc(n.subtitulo) + ')</small>' : ''}${n.tipo === 'rama' ? ' — ' + n.n + ' afirmaciones' : ''}</div>`).join('') : '<span class="vacio">ninguno</span>';
  let h = `<div class="cols">
  <div class="tarjeta"><h3>1. Demostrado sobre arena</h3><p>Piezas que se dan por demostradas pero se apoyan, aunque sea de lejos, en algo que no lo está.</p>
    ${A.flojos.length ? A.flojos.map(n => `<div class="aviso"><span class="enlace" data-ir2="${n.nombre}">${esc(n.titulo)}</span> ← ${n.apoyo_flojo.map(x => esc(nodos.get(x).titulo)).join(', ')}</div>`).join('') : '<div class="aviso bien">Ninguna. Todo lo demostrado del árbol descansa sobre piezas demostradas.</div>'}
    <p class="sub">Vale solo para lo registrado: las ramas sin conectar no se pueden comprobar.</p></div>
  <div class="tarjeta"><h3>2. Puntos débiles que sostienen algo</h3><p>Piezas medidas o pendientes que tienen otras encima. Lo que tienen encima tampoco está demostrado; si algún día una de estas cae, sabrás qué arrastra.</p>${lista(A.debiles)}</div>
  <div class="tarjeta"><h3>3. 👁 Falta revisión humana</h3><p>El ordenador (Lean) las da por buenas, pero ningún matemático las ha revisado todavía. Aquí es donde más puedes ayudar: conseguir que alguien las lea.</p>${lista(A.revision)}${COMPLEJO ? `<p class="sub">${A.revAf.length} afirmaciones llevan esa nota.</p>` : ''}</div>
  <div class="tarjeta"><h3>4. ⚠ Usan una hipótesis de fuera</h3><p>Son ciertas <i>si</i> se cumple algo que no probamos nosotros (por ejemplo, una cota de otro autor).</p>${lista(A.condicional)}${COMPLEJO ? `<p class="sub">${A.condAf.length} afirmaciones lo dicen en su enunciado.</p>` : ''}</div>
  <div class="tarjeta"><h3>5. Sin conectar al árbol</h3><p>Grupos de trabajo que el registro todavía no une con nada. No es que estén mal: falta anotar en qué se apoyan.</p>${lista(A.sueltos)}</div>`;
  if (COMPLEJO) h += `<div class="tarjeta"><h3>6. Refutadas (${A.refutadas.length})</h3><p>Afirmaciones que se comprobaron falsas. Se guardan para no repetirlas.</p>${A.refutadas.map(a => htmlAfirmacion(a, true)).join('')}</div>`;
  h += '</div>';
  const v = document.getElementById('vista-alarmas');
  v.innerHTML = h;
  v.addEventListener('click', e => {
    const t = e.target.closest('[data-ir2],[data-ir]');
    if (t) { mostrar('arbol'); elegir(t.dataset.ir2 || t.dataset.ir, true); }
  });
}

// ---------- tabla de afirmaciones ----------
function vistaAfirmaciones() {
  const v = document.getElementById('vista-afirmaciones');
  const grupos = [...nodos.values()].filter(n => (n.afirmaciones || []).length).sort((a, b) => a.titulo.localeCompare(b.titulo));
  v.innerHTML = `<div class="barra" style="margin:0 0 10px">
      <input id="fa-texto" placeholder="Buscar en el texto…" size="24">
      <select id="fa-estado"><option value="">todos los estados</option>${['demostrado', 'medido', 'conjeturado', 'refutado'].map(e => `<option>${e}</option>`).join('')}</select>
      <select id="fa-grupo"><option value="">todas las ramas</option>${grupos.map(g => `<option value="${esc(g.nombre)}">${esc(g.titulo)}${g.subtitulo ? ' (' + esc(g.subtitulo) + ')' : ''}</option>`).join('')}</select>
      <label><input type="checkbox" id="fa-rev"> solo 👁</label>
      <label><input type="checkbox" id="fa-lean"> solo Lean</label>
      <span id="fa-n" class="sub"></span></div><div id="fa-lista"></div>`;
  const pinta = () => {
    const t = document.getElementById('fa-texto').value.toLowerCase(), e = document.getElementById('fa-estado').value,
      g = document.getElementById('fa-grupo').value, r = document.getElementById('fa-rev').checked, l = document.getElementById('fa-lean').checked;
    const sel = D.afirmaciones.filter(a => (!e || a.estado === e) && (!g || a.grupo === g) && (!r || a.revision_humana) && (!l || a.lean) &&
      (!t || (a.enunciado + ' ' + (a.notas || '') + ' ' + (a.fichero || '')).toLowerCase().includes(t)));
    document.getElementById('fa-n').textContent = sel.length + ' de ' + D.afirmaciones.length;
    document.getElementById('fa-lista').innerHTML = sel.slice().reverse().map(a => htmlAfirmacion(a, true)).join('');
  };
  v.addEventListener('input', pinta);
  v.addEventListener('click', ev => { const x = ev.target.closest('[data-ir]'); if (x) { mostrar('arbol'); elegir(x.dataset.ir, true); } });
  pinta();
}
function vistaCorrecciones() {
  document.getElementById('vista-correcciones').innerHTML =
    `<p>Cosas que en algún momento se creyeron y luego resultaron falsas. Son ${D.correcciones.length} y se guardan como aprendizaje.</p>` +
    D.correcciones.slice().reverse().map(c => `<div class="tarjeta"><h3>#${c.id}</h3>
      <p><b>Se creía:</b> ${esc(c.creia)}</p><p><b>Por qué era falso:</b> ${esc(c.falsa)}</p><p><b>Lección:</b> ${esc(c.leccion)}</p></div>`).join('');
}

// ---------- búsqueda y botones ----------
document.getElementById('buscar').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const n = [...nodos.values()].find(n => (n.titulo + ' ' + (n.subtitulo || '') + ' ' + n.nombre).toLowerCase().includes(q));
  if (n) elegir(n.nombre, true);
});
document.getElementById('ver-todo').addEventListener('click', () => { limpiar(); cy && cy.fit(undefined, 30); });
document.getElementById('ir-actual').addEventListener('click', () => elegir(D.actual, true));

iniciar();
panelInicio();
vistaAlarmas();
if (COMPLEJO) { vistaAfirmaciones(); vistaCorrecciones(); }
let inicial = 'arbol';
try { const g = localStorage.getItem('mapa-vista-' + MODO); if (g && VISTAS.some(v => v[0] === g)) inicial = g; } catch (e) {}
mostrar(inicial);
</script>
</body>
</html>
